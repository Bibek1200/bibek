<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Hub</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: #0f0f0f;
            color: #fff;
        }

        header {
            background: #1a1a1a;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #ff4757;
        }

        header h1 {
            margin: 0;
            font-size: 3em;
            color: #ff4757;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }

        .social-links a {
            text-decoration: none;
            color: #fff;
            text-align: center;
        }

        .social-links img {
            width: 60px;
            height: 60px;
            transition: transform 0.3s ease;
        }

        .social-links img:hover {
            transform: scale(1.2);
        }

        .content {
            text-align: center;
            padding: 40px 20px;
        }

        button {
            background-color: #ff4757;
            border: none;
            padding: 15px 30px;
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 10px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>
    <header>
        <h1>Gaming Hub</h1>
    </header>

    <div class="social-links">
        <a href="https://www.youtube.com/" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube">
            <div>YouTube</div>
        </a>
        <a href="https://www.tiktok.com/" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/en/0/0a/TikTok_logo.svg" alt="TikTok">
            <div>TikTok</div>
        </a>
        <a href="https://www.twitch.tv/" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Twitch_Logo_2019.svg" alt="Twitch">
            <div>Twitch</div>
        </a>
    </div>

    <div class="content">
        <p>Welcome to the ultimate gaming hub. Connect with us on your favorite platforms and stay updated on all the latest gaming trends and live streams.</p>
        <button onclick="alertMessage()">Click Me!</button>
    </div>

    <script>
        function alertMessage() {
            alert("Welcome to Gaming Hub! Let's level up together.");
        }
    </script>
</body>
</html>
